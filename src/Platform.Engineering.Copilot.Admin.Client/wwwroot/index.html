<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform Engineering Copilot - Platform Admin Tool</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="css/app.css?v=6" rel="stylesheet" />
    <!-- Blazored Toast & Modal styles (embedded for standalone WASM) -->
    <style>
        /* Blazored Toast minimal styles */
        .blazored-toast-container { position: fixed; z-index: 9999; }
        .blazored-toast-container.position-topleft { top: 1rem; left: 1rem; }
        .blazored-toast-container.position-topright { top: 1rem; right: 1rem; }
        .blazored-toast-container.position-topcenter { top: 1rem; left: 50%; transform: translateX(-50%); }
        .blazored-toast-container.position-bottomleft { bottom: 1rem; left: 1rem; }
        .blazored-toast-container.position-bottomright { bottom: 1rem; right: 1rem; }
        .blazored-toast-container.position-bottomcenter { bottom: 1rem; left: 50%; transform: translateX(-50%); }
        .blazored-toast { display: flex; align-items: center; padding: 1rem; margin-bottom: 0.5rem; border-radius: 0.375rem; min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); animation: slideIn 0.3s ease-out; }
        .blazored-toast-success { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .blazored-toast-error { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        .blazored-toast-warning { background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
        .blazored-toast-info { background-color: #cff4fc; color: #055160; border: 1px solid #b6effb; }
        .blazored-toast-icon { margin-right: 0.75rem; font-size: 1.25rem; }
        .blazored-toast-message { flex-grow: 1; }
        .blazored-toast-close { background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 0; margin-left: 0.5rem; opacity: 0.5; }
        .blazored-toast-close:hover { opacity: 1; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Blazored Modal minimal styles */
        .blazored-modal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1050; }
        .blazored-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .blazored-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 0.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 90%; max-height: 90%; overflow: auto; }
        .blazored-modal-header { padding: 1rem; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; }
        .blazored-modal-body { padding: 1rem; }
        .blazored-modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    </style>
    <link href="Platform.Engineering.Copilot.Admin.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading Platform Engineering Copilot - Platform Admin Tool...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger fixed-bottom" style="display: none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
